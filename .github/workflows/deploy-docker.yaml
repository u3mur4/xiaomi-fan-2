name: Build and Push Docker Image

# This workflow can be triggered manually from the Gitea 'Actions' tab
on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Image version tag to build (e.g., v1.0.0)'
        required: true
        default: 'v1.0.0'

jobs:
  build-and-push:
    runs-on: ubuntu-latest # Or your own Gitea runner tag
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        # This sets up a builder instance that can create multi-platform images

      - name: Log in to Gitea Docker Registry
        uses: docker/login-action@v3
        with:
          registry: gitea.morix.site
          username: ${{ gitea.actor }} # The user who triggered the workflow
          password: ${{ secrets.GITEA_TOKEN }} # Use a dedicated token!

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/arm64
          push: true
          tags: |
            gitea.morix.site/hunser92/xiaomi-fan-2:${{ inputs.version }}
            gitea.morix.site/hunser92/xiaomi-fan-2:latest
