<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Fan Control</title>
  <style>
    /* --- Modern Theme & Variables --- */
    :root {
      --bg-color: #121212;
      --card-color: #1e1e1e;
      --primary-color: #0d6efd;
      --primary-hover: #0b5ed7;
      --text-color: #e0e0e0;
      --border-color: #444;
      --shadow-color: rgba(0, 0, 0, 0.4);
    }

    /* --- Base & Body Styles --- */
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-color);
      /* Use Flexbox to center the main content card vertically and horizontally */
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 1rem;
      box-sizing: border-box;
    }

    /* --- Main Content Card --- */
    .container {
      background-color: var(--card-color);
      padding: 2rem;
      border-radius: 12px;
      box-shadow: 0 8px 30px var(--shadow-color);
      border: 1px solid var(--border-color);
      width: 100%;
      max-width: 600px;
      text-align: center;
    }

    h1 {
      margin-top: 0;
      margin-bottom: 2rem;
      font-weight: 500;
      font-size: 1.75rem;
    }
    
    /* --- Responsive Button Grid --- */
    .controls-grid {
      display: grid;
      /* On mobile, start with 2 columns */
      grid-template-columns: 1fr 1fr;
      gap: 1rem;
    }

    /* --- Button Styling --- */
    .control-button {
      background-color: var(--primary-color);
      color: white;
      border: none;
      border-radius: 8px;
      padding: 1rem;
      font-size: 1rem;
      font-weight: 500;
      cursor: pointer;
      
      /* Align icon and text inside the button */
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;

      /* Smooth transition for hover/active states */
      transition: background-color 0.2s ease, transform 0.1s ease;
      -webkit-tap-highlight-color: transparent; /* Removes blue tap highlight on mobile */
    }

    .control-button:hover {
      background-color: var(--primary-hover);
    }

    .control-button:active {
      transform: scale(0.97); /* Give a "pressed" effect */
    }
    
    .control-button svg {
      width: 20px;
      height: 20px;
      stroke-width: 2.5;
    }

    /* --- Responsive Adjustments --- */
    /* On screens wider than 600px, change to a 4-column layout */
    @media (min-width: 600px) {
      .controls-grid {
        grid-template-columns: repeat(4, 1fr);
      }
    }
  </style>
</head>
<body>

  <main class="container">
    <h1>Xiaomi Fan Control</h1>
    
    <div class="controls-grid">
      <!-- Buttons are now laid out in a grid. The onclick function remains the same. -->
      <button type="button" class="control-button" name="toggle" onclick="setCmdAttribute(this.name)">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M12 2v10m8.49-8.49L13.41 10.6m-9.8 0L9.8 13.41M22 12h-10m-2 0H2m8.49 8.49L10.6 13.41m9.8 0L13.41 9.8"/></svg>
        Toggle
      </button>

      <button type="button" class="control-button" name="swing" onclick="setCmdAttribute(this.name)">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M4 12h16m-8-8v16"/></svg>
        Swing
      </button>

      <button type="button" class="control-button" name="speed_1" onclick="setCmdAttribute(this.name)">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M10 13l2-2l2 2m-2-7v5"/></svg>
        Speed 1
      </button>

      <button type="button" class="control-button" name="speed_2" onclick="setCmdAttribute(this.name)">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M3 17h18M3 12h18M3 7h18"/></svg>
        Speed 2
      </button>

      <button type="button" class="control-button" name="speed_3" onclick="setCmdAttribute(this.name)">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M4 6h16M4 12h16M4 18h16"/></svg>
        Speed 3
      </button>

      <button type="button" class="control-button" name="off_10" onclick="setCmdAttribute(this.name)">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M12 6v6l4 2"/></svg>
        Off 10'
      </button>

      <button type="button" class="control-button" name="off_20" onclick="setCmdAttribute(this.name)">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M12 6v6l4 2"/></svg>
        Off 20'
      </button>

      <button type="button" class="control-button" name="off_30" onclick="setCmdAttribute(this.name)">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M12 6v6l4 2"/></svg>
        Off 30'
      </button>
    </div>
  </main>

  <script>
    function setCmdAttribute(buttonName) {
      // This JavaScript is perfectly functional and remains unchanged.
      // It correctly constructs the URL and navigates to it.
      var urlParams = new URLSearchParams(window.location.search);
      urlParams.set('cmd', buttonName);
      
      var newUrl = window.location.origin + window.location.pathname + '?' + urlParams.toString();
      window.location.href = newUrl;
    }
  </script>

</body>
</html>
